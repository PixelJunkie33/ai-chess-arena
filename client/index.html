<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chess Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">♞ AI Chess <span>Arena</span></div>
    <div class="header-meta">
      <span class="badge" title="Match timer">⏱ <span id="match-timer" class="mono">00:00</span></span>
      <span class="badge badge-warn" title="Spectators">👁 <span id="spectator-count">0</span> watching</span>
      <span class="badge" id="conn-status">connecting…</span>
    </div>
  </header>

  <main class="layout">
    <aside class="panel agents" aria-label="Agents">
      <div class="agent-card" id="agent-white" data-color="white">
        <h2><span class="dot dot-white"></span> White</h2>
        <select id="select-white" aria-label="White agent"></select>
        <p class="agent-desc" id="desc-white"></p>
        <div class="thinking" id="thinking-white" hidden><span class="pulse"></span> thinking <span class="mono" id="think-time-white">0.0s</span></div>
      </div>
      <div class="agent-card" id="agent-black" data-color="black">
        <h2><span class="dot dot-black"></span> Black</h2>
        <select id="select-black" aria-label="Black agent"></select>
        <p class="agent-desc" id="desc-black"></p>
        <div class="thinking" id="thinking-black" hidden><span class="pulse"></span> thinking <span class="mono" id="think-time-black">0.0s</span></div>
      </div>
    </aside>

    <section class="board-wrap">
      <svg id="board" viewBox="0 0 600 600" role="img" aria-label="Chess board"></svg>
      <div class="eval-readout mono">Eval <span id="eval-readout">+0.00</span></div>
    </section>

    <aside class="panel history" aria-label="Move history">
      <h2>Moves</h2>
      <ol id="move-history" class="mono"></ol>
    </aside>
  </main>

  <section class="panel commentary-wrap" aria-label="Commentary">
    <h2>Commentary</h2>
    <div id="commentary" aria-live="polite"></div>
  </section>

  <section class="controls panel" aria-label="Controls">
    <button id="btn-start" class="btn btn-primary">Start</button>
    <button id="btn-pause" class="btn">Pause</button>
    <button id="btn-reset" class="btn">Reset</button>
    <label class="speed">Speed
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </label>
    <label class="speed"><input type="checkbox" id="coords" checked> Coordinates</label>
  </section>

  <section class="panel stats" aria-label="Stats">
    <div class="stat-block">
      <h2>All-time W / D / L <span class="muted">(white perspective)</span></h2>
      <div class="wdl mono"><span class="w" id="wdl-w">0</span> / <span id="wdl-d">0</span> / <span class="l" id="wdl-l">0</span></div>
    </div>
    <div class="stat-block grow">
      <h2>Material <span class="mono" id="material-label">0</span></h2>
      <div class="material-bar" id="material-bar"><div class="material-white" id="material-white"></div></div>
      <div class="captured mono"><span id="captured-by-white"></span><span id="captured-by-black"></span></div>
    </div>
    <div class="stat-block grow">
      <h2>Evaluation</h2>
      <svg id="eval-graph" viewBox="0 0 300 80" preserveAspectRatio="none" role="img" aria-label="Evaluation graph"></svg>
    </div>
  </section>

  <div id="overlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <h2 id="overlay-title"></h2>
      <p id="overlay-reason"></p>
      <p class="muted">Next match in <span id="overlay-count" class="mono">8</span>s</p>
      <div class="modal-actions">
        <button id="overlay-now" class="btn btn-primary">Start now</button>
        <button id="overlay-cancel" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
